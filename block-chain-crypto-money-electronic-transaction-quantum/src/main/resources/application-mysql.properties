# Optional MySQL backing store — activate with the `mysql` Spring profile:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#   java -jar target/tekmachain-0.1.0.jar --spring.profiles.active=mysql
# Needs a MySQL 8 on localhost:3306 (defaults root/root); the tekma_chain database is auto-created.
# Override with env vars, e.g. TEKMACHAIN_DB_NAME=tekma_chain_8081 for a second local node.
spring.datasource.url=jdbc:mysql://${TEKMACHAIN_DB_HOST:localhost}:${TEKMACHAIN_DB_PORT:3306}/${TEKMACHAIN_DB_NAME:tekma_chain}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${TEKMACHAIN_DB_USER:root}
spring.datasource.password=${TEKMACHAIN_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The H2 console is meaningless against MySQL — turn it off under this profile.
spring.h2.console.enabled=false
