spring.application.name=TekmaChain
server.port=8080

# --- Database: embedded H2, file-based (default) — nothing to install or run ---
# Data persists in ./data/tekmachain.mv.db across restarts. Just `mvn spring-boot:run`.
# Want MySQL instead? Run with the `mysql` profile: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# (config lives in application-mysql.properties). H2 speaks MySQL mode, so the schema is identical.
spring.datasource.url=jdbc:h2:file:./data/tekmachain;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Local data inspector — the H2 web console (localhost only) at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/tekmachain  ·  user: sa  ·  no password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- TekmaChain monetary policy (Bitcoin-style) ---
# Starting Proof-of-Work difficulty = required leading ZERO BITS of the block hash.
# 16 ≈ 65k hashes/block on a laptop. Adjusts automatically (see retarget below).
tekmachain.difficulty=16
# Difficulty retargets every N blocks toward this block time (like Bitcoin's 2016 / 10min).
tekmachain.pow.retarget-interval=16
tekmachain.pow.target-block-time-ms=30000
# Initial coins minted per block. Halves every halving-interval blocks (Bitcoin: 50, 210000).
tekmachain.block-reward=50
tekmachain.halving-interval=210000
# Hard cap on total supply (Bitcoin: 21,000,000). Mining past it pays fees only.
tekmachain.max-supply=21000000
# A mined (coinbase) reward can't be spent until it has this many confirmations (Bitcoin: 100).
tekmachain.coinbase-maturity=2

# Migration for pre-accounts databases: on startup, assign every ownerless wallet
# (except the exchange hot wallet) to this account. Blank = off. The account must exist.
tekmachain.claim-orphan-wallets-for=

# --- Auth hardening ---
# Lock a username after this many consecutive failed logins, for this cool-down.
tekmachain.auth.max-login-attempts=5
tekmachain.auth.lockout-minutes=15

# --- Actuator (ops health) ---
# Expose only health; show liveness/readiness detail so K8s probes are meaningful.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# --- Key custody (HSM stand-in) ---
# AES-256 seal for private keys at rest (base64, 32 bytes). Blank = built-in DEV seal.
# In production supply this via a secret / KMS: TEKMACHAIN_CUSTODY_MASTER_KEY
tekmachain.custody.master-key=${TEKMACHAIN_CUSTODY_MASTER_KEY:}

# --- Live FX rate feed (updates fiat USD rates; falls back to seeded rates offline) ---
tekmachain.fx.enabled=true
tekmachain.fx.url=https://open.er-api.com/v6/latest/USD
tekmachain.fx.refresh-ms=21600000
tekmachain.fx.initial-delay-ms=8000

# --- Live crypto market feed (real BTC/ETH/... prices from Coinbase; display-only reference data) ---
tekmachain.market.enabled=true
tekmachain.market.url=https://api.coinbase.com/v2/exchange-rates?currency=USD
tekmachain.market.refresh-ms=120000
tekmachain.market.initial-delay-ms=5000

# --- P2P networking (Phase 5) ---
# How other nodes reach THIS node. Defaults to localhost + this node's port.
tekmachain.node.self-url=http://localhost:${server.port}
# Comma-separated seed peers to connect to on startup, e.g. http://localhost:8081,http://localhost:8082
tekmachain.node.peers=
# How often (ms) to re-discover peers and reconcile to the longest chain.
tekmachain.node.sync-interval-ms=12000
tekmachain.node.sync-initial-delay-ms=6000
# Horizontal scaling: cap tracked peers, and gossip to a random subset each broadcast.
tekmachain.node.max-peers=16
tekmachain.node.gossip-fanout=6
