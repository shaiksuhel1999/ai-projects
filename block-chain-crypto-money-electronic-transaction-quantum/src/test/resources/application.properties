# Fast, throwaway settings for tests: in-memory H2 (MySQL-compatible mode), low difficulty.
spring.datasource.url=jdbc:h2:mem:tekmatest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
tekmachain.difficulty=8
tekmachain.block-reward=50
tekmachain.coinbase-maturity=0
tekmachain.fx.enabled=false
tekmachain.market.enabled=false
