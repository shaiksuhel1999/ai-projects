apiVersion: v1
kind: Secret
metadata:
  name: tekmachain-db
  namespace: tekmachain
type: Opaque
stringData:
  # Demo credentials — change these for anything real.
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: tekma_chain
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: tekmachain
spec:
  clusterIP: None          # headless service for the StatefulSet
  selector:
    app: tekmachain-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tekmachain-mysql
  namespace: tekmachain
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: tekmachain-mysql
  template:
    metadata:
      labels:
        app: tekmachain-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--mysql-native-password=ON"]
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: tekmachain-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
