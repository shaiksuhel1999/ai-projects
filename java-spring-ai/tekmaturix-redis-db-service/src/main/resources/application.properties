spring.application.name=tekmaturix-redis-db-service

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Redis Vector Store
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=product-index
spring.ai.vectorstore.redis.prefix=product:
spring.ai.vectorstore.redis.embedding-dimension=1024

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.embedding.model=mxbai-embed-large

logging.level.org.springframework.ai=DEBUG