spring.application.name=tekmaturix-image-model-service

spring.ai.openai.api-key=api_key

# Chat model
spring.ai.openai.chat.options.model=gpt-5
# Image generation model
spring.ai.openai.image.options.model=gpt-image-1
spring.ai.openai.image.options.size=1024x1024
spring.ai.openai.image.options.quality=low
