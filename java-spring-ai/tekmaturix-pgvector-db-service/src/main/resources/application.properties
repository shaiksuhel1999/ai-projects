spring.application.name=tekmaturix-pgvector-db-service

spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/pgvector
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

spring.main.allow-bean-definition-overriding=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.ai.vectorstore.pgvector.initialize-schema=false

spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.chat.options.model=llama3.2:3b

spring.ai.ollama.embedding.model=mxbai-embed-large:latest