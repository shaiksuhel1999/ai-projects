spring.application.name=commercial-loan-underwriting-realtime

# --- OpenAI (Spring AI) ---
# The LLM-backed nodes need a key. Set it as an environment variable
# OPENAI_API_KEY so you never commit a secret to source control.
#   PowerShell:  $env:OPENAI_API_KEY = "sk-..."
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.chat.client.enabled=true
spring.ai.openai.chat.options.temperature=0
